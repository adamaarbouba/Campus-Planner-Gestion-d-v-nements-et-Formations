<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game</title>
    <link href="output.css" rel="stylesheet">
</head>

<body class="overflow-hidden">
    
    <div class="h-14 bg-linear-120 from-[#222831] to-[#00a6c0]">
        
        <h1 class="text-[#00a6c0] text-4xl font-bold ml-3 mb-3">Game <span class="text-[#283b48]">Found</h1>
        <div class="Founddiv h-screen bg-linear-135 from-[#283b48] to-[#00a6c0]">
            <div class="flex justify-center">
                <input type="text" id="found" class="bg-[#222831] border-2 border-[#00a6c0] rounded-lg text-[#d8d7ce] text-center text-lg tracking-[0.4em] py-2.5 mt-4 w-4/5 " readonly>
            </div>
            <div class="flex justify-around">
                <p class="text-[#d8d7ce] text-2xl mt-4">Score : <span id="score" class="text-[#00a6c0] font-bold">0</span></p>
         <p class="text-[#d8d7ce] text-2xl mt-4">Tentatives : <span id="Tentatives" class="text-[#00a6c0] font-bold">5</span></p>
            </div>
        <div class="clavie  mt-6">
            <div class="butto grid grid-cols-6 gap-3">
                <button class="btn">a</button>
                <button class="btn">b</button>
                <button class="btn">c</button>
                <button class="btn">d</button>
                <button class="btn">e</button>
                <button class="btn">f</button>
                <button class="btn">g</button>
                <button class="btn">h</button>
                <button class="btn">i</button>
                <button class="btn">j</button>
                <button class="btn">k</button>
                <button class="btn">l</button>
                <button class="btn">m</button>
                <button class="btn">n</button>
                <button class="btn">o</button>
                <button class="btn">p</button>
                <button class="btn">q</button>
                <button class="btn">r</button>
                <button class="btn">s</button>
                <button class="btn">t</button>
                <button class="btn">u</button>
                <button class="btn">v</button>
                <button class="btn">w</button>
                <button class="btn">x</button>
                <button class="btn">y</button>
                <button class="btn">z</button>
            </div>
        </div>
        <script src="Game.js"></script>
</body>

</html>
