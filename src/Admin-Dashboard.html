<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Planner</title>
    <link href="./output.css" rel="stylesheet">
</head>

<body class="bg-gray-100 text-gray-800 min-h-screen flex flex-col">

    <header class="bg-white shadow p-4 flex justify-between items-center">
        <h1 class="text-2xl font-bold text-blue-600">Campus Planner Dashboard</h1>
        <nav>
            <ul class="flex space-x-4">
                <li><a href="Homepage.html" class="text-gray-600 hover:text-blue-600">Home</a></li>
                <li><a href="Formation.html" class="text-gray-600 hover:text-blue-600">Formations</a></li>
                <li><a href="Event.html" class="text-gray-600 hover:text-blue-600">Events</a></li>
            </ul>
        </nav>
    </header>

    <main class="grow container mx-auto p-6">
        <h2 class="text-3xl font-semibold mb-6 text-center">Dashboard Overview</h2>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-white shadow rounded-lg p-6 text-center">
                <h3 class="text-xl font-medium text-gray-600 mb-2">Total Formations</h3>
                <p id="total-formations" class="text-4xl font-bold text-blue-600">0</p>
            </div>

            <div class="bg-white shadow rounded-lg p-6 text-center">
                <h3 class="text-xl font-medium text-gray-600 mb-2">Total Events</h3>
                <p id="total-events" class="text-4xl font-bold text-green-600">0</p>
            </div>
        </div>
    </main>

    <footer class="bg-white text-gray-500 text-center py-4 border-t">
        Codewave Campus Planner 2025
    </footer>

    <script src="Index.js"></script>
</body>

</html>
